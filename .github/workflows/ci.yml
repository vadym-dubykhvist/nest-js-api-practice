name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test & build (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Lint, typecheck, unit test, build
        run: pnpm exec nx affected -t lint:check typecheck test build

  e2e:
    name: API E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nestjs_practice_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: E2E tests
        run: pnpm exec nx run @events/api:test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USERNAME: test
          DB_PASSWORD: test
          DB_NAME: nestjs_practice_test
          DB_SYNCHRONIZE: 'true'
          JWT_SECRET: test-secret

  docker:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            tag: nestjs-practice-api:ci
          - name: web
            dockerfile: apps/web/Dockerfile
            tag: nestjs-practice-web:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
